<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Napoli</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    window.THEME = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.theme = window.THEME;
  </script>
</head>
<body>
  <header>
    <h1>Pizza Napoli</h1>
    <button onclick="toggleTheme()">Theme</button>
  </header>
  <main id="menu"></main>
  <aside id="cart">
    <h2>Cart</h2>
    <ul id="cartItems"></ul>
    <p>Total: <b id="total">$0.00</b></p>
    <input id="promo" placeholder="Promo code">
    <button onclick="applyPromo()">Apply</button>
    <form id="orderForm" onsubmit="placeOrder(event)">
      <input id="name" placeholder="Name" required>
      <input id="phone" placeholder="Phone" required>
      <input id="address" placeholder="Address" required>
      <button type="submit">Place order</button>
    </form>
    <p id="msg"></p>
  </aside>
  <a href="javascript:void(0)" onclick="window.scrollTo(0,0)">Back to top</a>
  <script src="app.js"></script>
</body>
</html>
